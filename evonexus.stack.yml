version: "3.7"
services:

## --------------------------- ORION --------------------------- ##

  evonexus_dashboard:
    image: ghcr.io/neritondias/evo-nexus-dashboard:v0.24.0-swarm.4 ## publicada pelo GitHub Actions

    volumes:
      - evonexus_config:/workspace/config
      - evonexus_workspace:/workspace/workspace
      - evonexus_dashboard_data:/workspace/dashboard/data
      - evonexus_memory:/workspace/memory
      - evonexus_adw_logs:/workspace/ADWs/logs
      - evonexus_agent_memory:/workspace/.claude/agent-memory
      - evonexus_codex_auth:/root/.codex

    networks:
      - gmnet ## Nome da rede interna

    environment:
    ## ⚙️ Só infra. Todo resto (Anthropic, OpenAI/Codex, Telegram, WhatsApp,
    ## Stripe, Omie, Bling, Asaas etc.) é configurado pela UI no primeiro
    ## boot → /providers e /integrations. O entrypoint gera o
    ## EVONEXUS_SECRET_KEY automaticamente se faltar.
      - TZ=America/Sao_Paulo
      - EVONEXUS_PORT=8080
      - FORWARDED_ALLOW_IPS=*

    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M
      labels:
        - traefik.enable=1
        - traefik.docker.network=gmnet ## Nome da rede interna

        ## --- Router principal (Flask/SPA na porta 8080) ---
        - traefik.http.routers.evonexus_dashboard.rule=Host(`evonexus.example.com`) ## Domínio EvoNexus
        - traefik.http.routers.evonexus_dashboard.entrypoints=websecure
        - traefik.http.routers.evonexus_dashboard.priority=1
        - traefik.http.routers.evonexus_dashboard.tls.certresolver=letsencryptresolver
        - traefik.http.routers.evonexus_dashboard.service=evonexus_dashboard
        - traefik.http.services.evonexus_dashboard.loadbalancer.server.port=8080
        - traefik.http.services.evonexus_dashboard.loadbalancer.passHostHeader=true

        ## --- Router do terminal-server (Node PTY WS/HTTP na porta 32352) ---
        ## Prioridade maior (10) pra ganhar do router principal quando o path
        ## começa com /terminal. WebSocket funciona porque o Traefik detecta
        ## Upgrade header automaticamente no router comum.
        ## O stripprefix remove /terminal antes de encaminhar — o terminal-server
        ## expõe /api/... direto (ex.: /api/sessions/for-agent).
        - traefik.http.routers.evonexus_terminal.rule=Host(`evonexus.example.com`) && PathPrefix(`/terminal`) ## mesmo domínio, path prefix
        - traefik.http.routers.evonexus_terminal.entrypoints=websecure
        - traefik.http.routers.evonexus_terminal.priority=10
        - traefik.http.routers.evonexus_terminal.tls.certresolver=letsencryptresolver
        - traefik.http.routers.evonexus_terminal.service=evonexus_terminal
        - traefik.http.routers.evonexus_terminal.middlewares=evonexus_terminal_strip
        - traefik.http.middlewares.evonexus_terminal_strip.stripprefix.prefixes=/terminal
        - traefik.http.services.evonexus_terminal.loadbalancer.server.port=32352
        - traefik.http.services.evonexus_terminal.loadbalancer.passHostHeader=true

## --------------------------- ORION --------------------------- ##

  evonexus_telegram:
    image: ghcr.io/neritondias/evo-nexus-runtime:v0.24.0-swarm.4
    command:
      - "claude"
      - "--channels"
      - "plugin:telegram@claude-plugins-official"
      - "--dangerously-skip-permissions"

    volumes:
      - evonexus_config:/workspace/config
      - evonexus_workspace:/workspace/workspace
      - evonexus_memory:/workspace/memory
      - evonexus_adw_logs:/workspace/ADWs/logs
      - evonexus_agent_memory:/workspace/.claude/agent-memory
      - evonexus_codex_auth:/root/.codex

    networks:
      - gmnet ## Nome da rede interna

    environment:
    ## O entrypoint espera em loop até a ANTHROPIC_API_KEY aparecer no .env
    ## (ou seja, até você configurar em /providers). Nada de crash-loop.
      - TZ=America/Sao_Paulo
      - REQUIRE_ANTHROPIC_KEY=1

    stdin_open: true
    tty: true

    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M

## --------------------------- ORION --------------------------- ##

  evonexus_scheduler:
    image: ghcr.io/neritondias/evo-nexus-runtime:v0.24.0-swarm.4
    command: ["uv", "run", "python", "scheduler.py"]

    volumes:
      - evonexus_config:/workspace/config
      - evonexus_workspace:/workspace/workspace
      - evonexus_memory:/workspace/memory
      - evonexus_adw_logs:/workspace/ADWs/logs
      - evonexus_agent_memory:/workspace/.claude/agent-memory
      - evonexus_codex_auth:/root/.codex

    networks:
      - gmnet ## Nome da rede interna

    environment:
      - TZ=America/Sao_Paulo
      - REQUIRE_ANTHROPIC_KEY=1

    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M

## --------------------------- ORION --------------------------- ##

volumes:
  evonexus_config:
  evonexus_workspace:
  evonexus_dashboard_data:
  evonexus_memory:
  evonexus_adw_logs:
  evonexus_agent_memory:
  evonexus_codex_auth:

networks:
  gmnet: ## Nome da rede interna
    external: true
    name: gmnet ## Nome da rede interna
